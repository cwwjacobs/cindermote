name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: python -m pip install ruff mypy cryptography

      # Rules and the per-file exceptions for hash-pinned guest sources live in
      # pyproject.toml.
      - name: Ruff
        run: ruff check .

      # A typed core that must stay clean. Widen this list as modules are cleaned up.
      - name: Mypy
        run: >-
          mypy
          cli.py
          kernel_laws.py
          capability_brokers.py
          collapse_mesh.py
          scripts/open-agent-probe-evidence.py
          agent_probe/broker.py
          agent_probe/canonical.py
          agent_probe/contract.py
          agent_probe/crypto.py
          agent_probe/evidence.py
          agent_probe/hpke.py
          agent_probe/ksl.py
          agent_probe/protocol.py
          agent_probe/receipt.py
          agent_probe/runner.py
          agent_probe/secretstream.py

      - name: Declared registries agree with the tree
        run: python cli.py kernel-laws

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsodium23

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov cryptography

      - name: Compile Python sources
        run: python -m compileall -q .

      # Coverage is measured here and gated by fail_under in pyproject.toml. The
      # hosted runner cannot admit the namespace sandbox, so the sandbox
      # integration tests skip; the gate is set from that worst case.
      - name: Run unprivileged test suite
        run: >-
          python -m pytest -q tests
          --deselect=tests/test_agent_probe_runtime_protocol.py::test_job_image_copies_opaque_target_without_parsing
          --cov --cov-report=term-missing:skip-covered

      - name: Run root-required job image contract
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo "$PYTHON_BIN" -m pytest -q \
            tests/test_agent_probe_runtime_protocol.py::test_job_image_copies_opaque_target_without_parsing
