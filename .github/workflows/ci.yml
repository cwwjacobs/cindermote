name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsodium23

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest cryptography

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run unprivileged test suite
        run: >-
          python -m pytest -q tests
          --deselect=tests/test_agent_probe_runtime_protocol.py::test_job_image_copies_opaque_target_without_parsing

      - name: Run root-required job image contract
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo "$PYTHON_BIN" -m pytest -q \
            tests/test_agent_probe_runtime_protocol.py::test_job_image_copies_opaque_target_without_parsing
